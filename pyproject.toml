[project.optional-dependencies]
dev = ["pytest>=7.0"]
docs = ["pillow>=10.0"]

[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "tfredact"
version = "0.1.0"
description = "Scan Terraform state & plan files for secrets, redact them into shareable copies, and audit sensitive = true coverage."
readme = "README.md"
requires-python = ">=3.9"
license = { text = "MIT" }
authors = [{ name = "0xshaikh" }]
keywords = [
    "terraform", "tflint", "secrets", "secret-scanning", "state-file",
    "redaction", "iac", "security", "devops", "tfstate", "tfplan",
]
classifiers = [
    "Development Status :: 4 - Beta",
    "Environment :: Console",
    "Intended Audience :: Developers",
    "Intended Audience :: System Administrators",
    "License :: OSI Approved :: MIT License",
    "Operating System :: OS Independent",
    "Programming Language :: Python :: 3",
    "Programming Language :: Python :: 3.9",
    "Programming Language :: Python :: 3.10",
    "Programming Language :: Python :: 3.11",
    "Programming Language :: Python :: 3.12",
    "Programming Language :: Python :: 3.13",
    "Topic :: Security",
    "Typing :: Typed",
]

[project.scripts]
tfredact = "tfredact.cli:main"

[project.urls]
Homepage = "https://github.com/0xshaikh/tfredact"
Documentation = "https://0xshaikh.github.io/tfredact/"
Repository = "https://github.com/0xshaikh/tfredact"
Issues = "https://github.com/0xshaikh/tfredact/issues"

[tool.setuptools]
packages = ["tfredact"]

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-q"

[tool.ruff]
line-length = 100
target-version = "py39"

[tool.ruff.lint]
select = ["E", "F", "W", "I", "B", "UP"]
