name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]
  release:
    types: [published]

permissions:
  contents: read

jobs:
  test:
    name: pytest (python ${{ matrix.python }}, ${{ matrix.os }})
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, macos-latest, windows-latest]
        python: ["3.9", "3.10", "3.11", "3.12", "3.13"]
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python }}
          cache: pip

      - name: Install (no runtime deps)
        run: python -m pip install -e .

      - name: Confirm zero runtime dependencies
        run: python -m pip check

      - name: Run tests
        run: python -m pip install pytest && python -m pytest tests -q

  cli:
    name: CLI smoke test
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Install
        run: python -m pip install -e .
      - name: scan clean state exits 0
        run: |
          tfredact scan examples/clean.tfstate --no-color
          echo "exit 0 as expected"
      - name: scan dirty state exits 1
        run: |
          if tfredact scan examples/sample.tfstate --no-color; then
            echo "expected non-zero exit"; exit 1
          fi
      - name: plan filters stdin
        run: |
          tfredact plan < examples/plan-output.txt > /tmp/redacted.txt
          if grep -q "EXAMPLEKEY" /tmp/redacted.txt; then
            echo "secret leaked into plan output"; exit 1
          fi
      - name: redact removes secrets and keeps JSON valid
        run: |
          tfredact redact examples/sample.tfstate -o /tmp/redacted.tfstate
          python -c "import json; json.load(open('/tmp/redacted.tfstate'))"
          if grep -q "EXAMPLEKEY" /tmp/redacted.tfstate; then
            echo "secret leaked into redacted state"; exit 1
          fi
      - name: audit matches manifest
        run: |
          tfredact audit examples/main.tf --no-color || true

  pages:
    name: Build docs site
    runs-on: ubuntu-latest
    needs: [test, cli]
    steps:
      - uses: actions/checkout@v4
      - name: Validate docs site
        run: |
          test -f docs/index.html
          echo "docs site present"
